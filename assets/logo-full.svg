<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fullBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Master Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d6" />
      <stop offset="25%" stop-color="#fad961" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997b1e" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0fcff" />
      <stop offset="35%" stop-color="#00f0ff" />
      <stop offset="80%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0044aa" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container (Subtle Obsidian Plate) -->
  <rect width="1200" height="340" rx="36" fill="url(#fullBg)" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- ========================================================
       LEFT: 3D ISOMETRIC A²S EMBLEM (Scale ~0.55 centered at X=180, Y=170)
       ======================================================== -->
  <g transform="translate(45, 30) scale(0.55)">
    <!-- Base Plate -->
    <path d="M256 420 L116 345 L256 270 L396 345 Z" fill="rgba(212, 175, 55, 0.08)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" />
    <path d="M116 345 L116 358 L256 433 L396 358 L396 345 L256 420 Z" fill="rgba(153, 123, 30, 0.25)" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />

    <!-- Mid Plate -->
    <path d="M256 350 L126 280 L256 210 L386 280 Z" fill="rgba(212, 175, 55, 0.16)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" />
    <path d="M126 280 L126 292 L256 362 L386 292 L386 280 L256 350 Z" fill="rgba(212, 175, 55, 0.3)" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />

    <!-- Legs of A -->
    <path d="M174 340 L256 128" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />
    <path d="M338 340 L256 128" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />
    <line x1="198" y1="262" x2="314" y2="262" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Top Cyan Plate -->
    <path d="M256 182 L168 135 L256 88 L344 135 Z" fill="rgba(0, 240, 255, 0.22)" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Cyan 'S' Ribbon -->
    <path d="M298 198 C298 165, 214 165, 214 212 C214 252, 298 245, 298 290 C298 335, 206 335, 206 298" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Superscript '2' -->
    <g transform="translate(322, 82)">
      <circle cx="28" cy="28" r="30" fill="#061224" stroke="url(#cyanGrad)" stroke-width="2.5" />
      <path d="M20 18 C20 13, 36 13, 36 21 C36 27, 20 33, 20 40 L38 40" fill="none" stroke="url(#cyanGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    </g>

    <!-- Nodes -->
    <circle cx="256" cy="135" r="9" fill="#ffffff" filter="url(#glow)" />
    <circle cx="256" cy="135" r="4.5" fill="#00f0ff" />
    <circle cx="168" cy="135" r="4.5" fill="#00f0ff" />
    <circle cx="344" cy="135" r="4.5" fill="#00f0ff" />
    <circle cx="126" cy="280" r="4.5" fill="#fad961" />
    <circle cx="386" cy="280" r="4.5" fill="#fad961" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="375" y1="65" x2="375" y2="275" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 6" />

  <!-- ========================================================
       RIGHT: TYPOGRAPHIC IDENTITY
       ======================================================== -->
  <g transform="translate(425, 0)">
    <!-- Primary Logotype: A²STACKS -->
    <text x="0" y="165" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="94" font-weight="800" fill="url(#goldGrad)" letter-spacing="3">
      A<tspan dy="-36" font-size="52" fill="url(#cyanGrad)">2</tspan><tspan dy="36" fill="#ffffff">STACKS</tspan>
    </text>

    <!-- Sub-Brand Tagline / Hierarchy: TECHNOLOGIES -->
    <text x="6" y="222" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="24" font-weight="600" fill="url(#cyanGrad)" letter-spacing="12">
      TECHNOLOGIES
    </text>

    <!-- Strategic Descriptor Line -->
    <text x="8" y="260" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#94a3b8" letter-spacing="3.5">
      DIGITAL ENGINEERING STUDIO · WEB // CRM // AI
    </text>

    <!-- Futuristic Terminal Dots -->
    <circle cx="490" cy="216" r="4" fill="#00f0ff" filter="url(#glow)" />
    <circle cx="515" cy="216" r="3" fill="#fad961" />
  </g>
</svg>
