<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220" />
      <stop offset="100%" stop-color="#03060d" />
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2" />
      <stop offset="50%" stop-color="#fad961" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Container with Gold Border -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Base Plate: Infrastructure -->
  <path d="M32 50L14 40L32 30L50 40L32 50Z" stroke="url(#favGold)" stroke-width="2.5" fill="rgba(212, 175, 55, 0.15)" stroke-linejoin="round"/>
  
  <!-- Middle Plate: Core ERP & Systems -->
  <path d="M32 38L14 28L32 18L50 28L32 38Z" stroke="url(#favGold)" stroke-width="2.5" fill="rgba(212, 175, 55, 0.25)" stroke-linejoin="round"/>
  
  <!-- Top Floating Plate: AI & Web -->
  <path d="M32 25L18 17L32 9L46 17L32 25Z" stroke="url(#favCyan)" stroke-width="3" fill="rgba(0, 240, 255, 0.35)" stroke-linejoin="round"/>
  
  <!-- Central Glowing Pulse Node -->
  <circle cx="32" cy="17" r="3.2" fill="#00f0ff"/>
</svg>
